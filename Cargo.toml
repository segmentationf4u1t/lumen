[package]
name = "vulcan"
version = "0.1.0"
edition = "2021"
description = "Minimal user-space HID controller for the ROCCAT Vulcan II Mini"
license = "GPL-2.0-or-later"
build = "build.rs"

[lib]
name = "vulcan"
path = "src/lib.rs"

[[bin]]
name = "vulcanctl"
path = "src/bin/vulcanctl.rs"

[[bin]]
name = "vulcand"
path = "src/bin/vulcand.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
